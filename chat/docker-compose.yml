
services:
  broker:
    build: .
    command: node broker.js
    ports:
      - "5559:5559"
      - "5560:5560"

  proxy:
    build: .
    command: node proxy.js
    ports:
      - "5557:5557"
      - "5558:5558"

  server:
    build: .
    command: node servidor.js
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - broker
      - proxy

  client:
    build: .
    command: node client.js
    deploy:
      replicas: 3
    depends_on:
      - broker
      - proxy