
services:
  broker:
    build:
      context: .
      dockerfile: Dockerfile
    command: node broker.js
    ports:
      - "5559:5559"
      - "5560:5560"
    expose:
      - "5556"

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    command: node proxy.js
    ports:
      - "5557:5557"
      - "5558:5558"

  referencia:
    build:
      context: .
      dockerfile: Dockerfile.referencia
    command: python referencia.py
    depends_on:
      - broker

  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: node servidor.js
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - broker
      - proxy
      - referencia

  client:
    build:
      context: .
      dockerfile: Dockerfile
    command: node client.js
    depends_on:
      - broker
      - proxy
      - server
