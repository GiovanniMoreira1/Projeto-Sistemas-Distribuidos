syntax = "proto3";

// Contrato unico de comunicacao do grupo: todas as linguagens geram o codigo a partir deste arquivo.
// As opcoes abaixo so afetam a linguagem correspondente e sao ignoradas pelas outras.
option csharp_namespace = "ChatCSharp.Gen";
option java_multiple_files = true;
option java_package = "sd.projeto.protos";

// requisicao: cliente -> servidor, servidor -> referencia, servidor -> servidor
// e operacoes replicadas no topico "replicacao|<servidor de origem>"
message Mensagem {
  double timestamp = 1;
  string acao = 2;
  string canal = 3;
  string conteudo = 4;
  int32 contadorMensagem = 5;
}

// resposta de servidor (clientes e outros servidores)
message Resposta {
  string status = 1;
  string resposta = 2;
  repeated string canais = 3;
  int32 contadorMensagem = 4;
  double timestamp = 5;
}

// publicacao nos canais e anuncio do coordenador (topico "servers|")
message RespostaSub {
  double timestampEnvio = 1;
  string canal = 2;
  string conteudo = 3;
  double timestampRecebimento = 4;
  int32 contadorMensagem = 5;
}

message ServidorInfo {
  string nome = 1;
  int32 rank = 2;
}

// resposta do servico de referencia
message RespostaReferencia {
  string status = 1;
  string resposta = 2;
  int32 rank = 3;
  repeated ServidorInfo servidores = 4;
  int32 contadorMensagem = 5;
  string servidorEleito = 6;
}
